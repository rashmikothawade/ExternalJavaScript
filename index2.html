<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day1</title>
    <script>
        console.log("Addition of 2 numbers");
        let a=10;
        let b=35;
        let sum=a+b;
        console.log(`Addition of ${a} and ${b} : ${sum}`);  
    </script>
    <script>
        console.log("Subtraction of 2 numbers");
        let p=100;
        let q=35;
        let sub=p-q;
        console.log(`Subtraction of ${p} and ${q} : ${sub}`);  
    </script>
    <script>
        console.log("Multiplication of 2 numbers");
        let x=6;
        let y=35;
        let mul=x*y;
        console.log(`Multiplication of ${x} and ${y} : ${mul}`);  
    </script>
    <script>
        console.log("Division of 2 numbers");
        let m=100;
        let n=25;
        let div=m/n;
        console.log(`Division of ${m} and ${n} : ${div}`);  
    </script>
    <script>
        console.log("Square of a number");
        let num=7;
        let square=num*num;
        console.log(`Square of ${num} : ${square}`);
    </script>
    <script>
        console.log("Cube of a number");
        let no=4;
        let cube=no*no*no;
        console.log(`Cube of ${no} : ${cube}`);
    </script>

</head>
<body>
    <h1>Welcome to JavaScript</h1>
    <h1>Internal JavaScript</h1>
</body>
</html>
